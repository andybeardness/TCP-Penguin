name: tcp_penguin
description: "Fast and simple TCP port scanner for Android"
homepage: https://github.com/andybeardness/TCP-Penguin-Flutter
repository: https://github.com/andybeardness/TCP-Penguin-Flutter
issue_tracker: https://github.com/andybeardness/TCP-Penguin-Flutter/issues
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
      sdk: flutter

  cupertino_icons: ^1.0.8
  async: ^2.13.0
  pool: ^1.5.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  get_it: ^8.2.0
  rxdart: ^0.28.0
  go_router: ^16.3.0
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  intl: ^0.20.2
  dynamic_color: ^1.8.1
  mocktail: ^1.0.4
  csv: ^6.0.0
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true